<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copyit</title>
<script src="theme.js"></script>
<script src="i18n-data.js"></script><script src="i18n.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="popup">

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><img src="icons/icon128.png" alt="" width="64" height="64"></div>
    <div>
      <h1>Copyit</h1>
      <p><svg class="i xs" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private · saved on this device</p>
    </div>
  </div>
  <div class="tools"><button id="openDashboard" class="ib lg" title="Open full dashboard"><svg class="i" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></button><span class="cwrap langwrap"><button id="langBtn" class="ib lg" type="button" title="Language" aria-label="Language" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9S14.6 18.2 12 21c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></svg></button><div class="cmenu langmenu" id="langMenu" hidden data-no-i18n></div></span><button id="themeBtn" class="ib lg themebtn" type="button" title="Switch light or dark" aria-label="Switch light or dark"></button></div>
</header>

<div class="toolbar">
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="search" type="search" placeholder="Search clips, #tags, types" autocomplete="off"></label>
  <button id="saveClipboard" class="btn primary" title="Read the clipboard and save it"><span class="spin"></span><svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="3"/><path d="M9 4V3h6v1M12 9v6M9.5 12.5L12 15l2.5-2.5"/></svg><span>Save clipboard</span></button>
</div>

<div class="segrow">
<nav class="seg" id="filterChips" aria-label="Filter">
  <span class="thumb"></span>
  <button class="on" data-filter="all">All <b id="statTotal">0</b></button>
  <button data-filter="pinned">Pinned <b id="statPinned">0</b></button>
  <button data-filter="favorites">Starred <b id="statStarred">0</b></button>
</nav>
<span class="info" tabindex="0" role="button" aria-label="Tips"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg><span class="tip" role="tooltip">Press <kbd>Ctrl</kbd>+<kbd>V</kbd> to save what you copied, or use Save clipboard. <kbd>Alt</kbd>+<kbd>1&ndash;9</kbd> copies a clip.</span></span>
</div>

<div class="chiprow" id="chipRow"><nav class="chips" id="typeChips" aria-label="Type">
  <button class="on" data-type="all">All types</button>
  <button data-type="text"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Text</button>
  <button data-type="link"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Links</button>
  <button data-type="code"><svg class="i" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>Code</button>
</nav><button type="button" id="chipsToggle" class="ib" title="Show all types" aria-expanded="false" aria-label="Show all types"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div class="tagbar" id="tagBar" hidden></div>
<div class="tagbar foldbar" id="folderBar"></div>

<section id="list" class="list"></section>

<button class="fab" data-add title="Add text"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="bottom">
  <span id="toolsHost"></span><span id="count"></span>
  <span class="bicons">
    <span class="cwrap"><button id="ioBtn" class="ib" title="Import &amp; export" aria-label="Import and export" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M8 4v12M4.5 12.5L8 16l3.5-3.5M16 20V8M12.5 11.5L16 8l3.5 3.5"/></svg></button>
    <div class="cmenu io" id="ioMenu" hidden>
      <button type="button" data-io="import"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg><span>Import backup or files</span></button>
      <div class="cs"></div>
      <button type="button" data-io="json"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></svg><span>Export backup (JSON)</span></button>
      <button type="button" data-io="csv"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></svg><span>Export as CSV</span></button>
      <button type="button" data-io="txt"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></svg><span>Export text as .txt</span></button>
      <button type="button" data-io="md"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></svg><span>Export text as Markdown</span></button>
    </div></span>
    <span class="cwrap"><button id="chatBtn" class="ib" title="Support and help" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.1M12 12h.1M15.5 12h.1"/></svg></button>
    <div class="cmenu" id="chatMenu" hidden>
      <button type="button" data-c="email"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg><span>Copy support email</span><svg class="i x" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>
      <button type="button" data-c="coffee"><svg class="i" viewBox="0 0 24 24"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2.5 2.5 0 0 1 0 5h-2M8 3v2M12 3v2"/></svg><span>Buy the author a coffee</span><svg class="i x" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></button>
      <div class="cs"></div>
      <button type="button" data-c="feedback"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Feedback form</span><svg class="i x" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></button>
      <button type="button" data-c="docs"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5V21M8 7h8"/></svg><span>View Docs &amp; Guide</span><svg class="i x" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></button>
    </div></span>
    <button id="popSettings" class="ib" title="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </span>
</div>

<dialog id="addDialog">
  <form method="dialog" id="addForm">
    <h2>Add text</h2>
    <p>Type or paste anything you want to keep.</p>
    <textarea id="addText" placeholder="Enter text to save…" rows="5"></textarea>
    <div class="dlg-foot"><span class="kbd">Ctrl + Enter to save</span><span class="spacer"></span><button type="button" class="btn sm" id="addCancel">Cancel</button><button type="submit" class="btn primary sm" id="addSave">Save</button></div>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script src="lib.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script src="share.js"></script>
<script src="tools.js"></script>
</body>
</html>
