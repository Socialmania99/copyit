<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Copyit video player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
/* Small player used by the Copyit extension. YouTube refuses to play inside an extension page
   (Error 153: no web address to check), so the extension shows this page, which embeds the video. */
(function () {
  var q = new URLSearchParams(location.search), v = q.get('v') || '', s = parseInt(q.get('start') || '0', 10) || 0;
  if (!/^[\w-]{11}$/.test(v)) { document.body.textContent = 'No video.'; return; }
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/' + v + '?autoplay=1&rel=0&playsinline=1&origin=' + encodeURIComponent(location.origin) + (s ? '&start=' + s : '');
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
